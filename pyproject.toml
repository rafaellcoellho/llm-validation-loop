[project]
name = "llm-validation-loop"
version = "0.1.0"
description = "Self-correction with a deterministic validator: an LLM reads vote tallies from photos, code checks the sums, and failed checks feed the next attempt."
readme = "README.md"
authors = [
    { name = "Rafael Coelho", email = "rafaellcoellho@gmail.com" }
]
requires-python = ">=3.13.14"
dependencies = [
    "google-genai>=2.29.0",
    "matplotlib>=3.11.2",
    "onnxruntime>=1.31.0",
    "pillow>=12.3.0",
    "pydantic>=2.14.0",
    "rapidocr>=3.10.0",
]

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = ["llm_validation_loop", "tally_sheet"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]
